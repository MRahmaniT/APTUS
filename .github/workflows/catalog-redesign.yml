name: Prepare APTUS catalog redesign
on:
  push:
    branches: [development/catalog-redesign]
    paths: ['.github/catalog-redesign/**', '.github/workflows/catalog-redesign.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: development/catalog-redesign
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Import catalog and convert frontend to JavaScript
        run: node .github/catalog-redesign/migrate.mjs
      - name: Check source, catalog data and original assets
        run: npm run check
      - name: Build production website
        run: npm run build
      - name: Commit verified source to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply catalog design, shared content and JavaScript frontend to APTUS"
          git push origin HEAD:development/catalog-redesign
