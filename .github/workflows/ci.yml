name: Web CI

on:
  push:
    branches:
      - new
      - main2
      - 'development/**'
      - 'release/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aptus
          POSTGRES_USER: aptus
          POSTGRES_PASSWORD: aptus-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aptus -d aptus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Check launcher syntax
        run: |
          bash -n aptus.sh
          bash -n dev.sh
          bash dev.sh help >/dev/null

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm install --prefix server --ignore-scripts

      - name: Verify visual-only scope against original website
        run: node scripts/check-style-scope.mjs

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Check API syntax
        run: npm run check --prefix server

      - name: Apply PostgreSQL migrations
        run: npm run migrate --prefix server
        env:
          DATABASE_URL: postgresql://aptus:aptus-ci-password@127.0.0.1:5432/aptus

      - name: Start API
        run: node server/src/index.js > /tmp/aptus-api.log 2>&1 &
        env:
          DATABASE_URL: postgresql://aptus:aptus-ci-password@127.0.0.1:5432/aptus
          PORT: 3000

      - name: Verify API and database health
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/api/health

      - name: Exercise auth and CMS against PostgreSQL
        run: npm run smoke --prefix server
        env:
          API_BASE: http://127.0.0.1:3000/api

      - name: Install browser QA
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium

      - name: Checkout catalog visual reference
        uses: actions/checkout@v4
        with:
          repository: MRahmaniT/APTUS-Catalog
          ref: 75c645424c5ac5dba0d27c15e889d07a1aeebf91
          path: qa-reference

      - name: Start catalog visual reference
        run: node server/src/index.js > /tmp/aptus-catalog.log 2>&1 &
        env:
          DATABASE_URL: postgresql://aptus:aptus-ci-password@127.0.0.1:5432/aptus
          PORT: 3001
          STATIC_DIR: ${{ github.workspace }}/qa-reference/dist

      - name: Compare website and catalog visually
        run: node scripts/catalog-visual-qa.mjs

      - name: Verify original website and catalog styling in browser
        run: node scripts/browser-smoke.mjs

      - name: Upload visual QA screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: website-visual-qa
          path: qa-artifacts/
          if-no-files-found: ignore
