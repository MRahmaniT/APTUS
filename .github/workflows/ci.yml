name: Web CI

on:
  push:
    branches:
      - new
      - 'development/**'
      - 'release/**'
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: aptus
          POSTGRES_USER: aptus
          POSTGRES_PASSWORD: aptus-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aptus -d aptus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm install --prefix server --ignore-scripts

      - name: Typecheck web
        run: npm run typecheck

      - name: Build web
        run: npm run build

      - name: Check API syntax
        run: npm run check --prefix server

      - name: Apply PostgreSQL migrations
        run: npm run migrate --prefix server
        env:
          DATABASE_URL: postgresql://aptus:aptus-ci-password@127.0.0.1:5432/aptus

      - name: Start API
        run: node server/src/index.js > /tmp/aptus-api.log 2>&1 &
        env:
          DATABASE_URL: postgresql://aptus:aptus-ci-password@127.0.0.1:5432/aptus
          PORT: 3000

      - name: Verify API and database
        run: curl --fail --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:3000/api/health
