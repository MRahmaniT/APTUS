name: APTUS Desktop Demo

on:
  workflow_dispatch:
  push:
    branches:
      - 'demo/**'

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './desktop-demo/src-tauri -> target'

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck

      - name: Build offline demo frontend
        run: npm run build -- --mode demo

      - name: Build Windows desktop demo
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: desktop-demo/src-tauri
          args: --bundles nsis

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: APTUS-Demo-Windows
          path: desktop-demo/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
