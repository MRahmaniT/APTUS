services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: aptus
      POSTGRES_USER: aptus
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.server}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aptus -d aptus"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - aptus_db_data:/var/lib/postgresql/data

  app:
    build:
      context: .
      args:
        VITE_API_BASE: /api
        VITE_DATA_MODE: server
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://aptus:${POSTGRES_PASSWORD}@db:5432/aptus
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-10}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-30}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-100}
      UPLOAD_DIR: /app/data/uploads
      STATIC_DIR: /app/dist
    ports:
      - "${APTUS_PORT:-3000}:3000"
    volumes:
      - aptus_uploads:/app/data/uploads

  # Optional browser database UI. It is bound to localhost only; use an SSH tunnel on a remote server.
  adminer:
    image: adminer:6
    profiles: ["tools"]
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ADMINER_DEFAULT_SERVER: db
    ports:
      - "127.0.0.1:${ADMINER_PORT:-8080}:8080"

volumes:
  aptus_db_data:
  aptus_uploads:
